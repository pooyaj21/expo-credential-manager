apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.credentialmanager'
version = '1.0.0'

android {
  namespace "expo.modules.credentialmanager"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.credentials:credentials:1.5.0"
  // Below API 34 the framework ships no credential provider of its own, so
  // without this artifact Google Password Manager is never reached and every
  // request comes back NoCredentialException on most of the install base.
  implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
}
